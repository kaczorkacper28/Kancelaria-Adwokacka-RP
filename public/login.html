<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logowanie — Kancelaria RP</title><link rel="stylesheet" href="/public/style.css"></head><body class="login-page"><main class="login-card"><div class="mark">⚖</div><p class="eyebrow">PANEL ZARZĄDU</p><h1>Kancelaria Adwokacka RP</h1><p class="muted">Zaloguj się do systemu kancelarii.</p><form id="login"><label>Login<input name="username" autocomplete="username" required></label><label>Hasło<input name="password" type="password" autocomplete="current-password" required></label><button>Zaloguj się</button><p id="error" class="error"></p></form><small>Środowisko RolePlay · Dostęp dla upoważnionych</small></main><script>document.querySelector("#login").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:f.get("username"),password:f.get("password")})});const d=await r.json();if(r.ok)location.href="/app";else document.querySelector("#error").textContent=d.error||"Błąd logowania"});</script></body></html>
